name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install from the lockfile
        run: npm ci
      - name: Typecheck and build every workspace
        run: npm run build
      - name: Paywall regression checks
        if: matrix.node == '22'
        run: npm test -w packages/x402-middleware

  manifests:
    name: Package manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Every manifest parses and declares what npm needs
        run: |
          status=0
          for manifest in package.json packages/*/package.json; do
            node -e '
              const fs = require("fs");
              const path = process.argv[1];
              const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
              const missing = ["name", "version", "description", "license"].filter((key) => !pkg[key]);
              if (missing.length > 0) {
                console.error(path + " is missing: " + missing.join(", "));
                process.exit(1);
              }
            ' "$manifest" || status=1
          done
          exit $status

  secrets:
    name: No credentials committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Refuse an .env file or a mnemonic in the tree
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "An .env file is tracked. Remove it and rotate the values."
            exit 1
          fi
          if git grep -nIE '(mnemonic|seed[_-]?phrase)[[:space:]]*[:=][[:space:]]*["'"'"'][a-z]+( [a-z]+){11,}' -- ':!*.md' ':!package-lock.json'; then
            echo "A literal mnemonic is committed. Remove it and move the funds."
            exit 1
          fi
          echo "No credential pattern found."
